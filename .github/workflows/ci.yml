  #       with:
  #         node-version-file: .nvmrc
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm exec playwright install --with-deps chromium
  #     - run: pnpm test:e2e

  # Visual regression runs in its own workflow (visual.yml, M3-14) on `templates/**` changes
  # and nightly (plan 08 §8.9, 13 §13.7).
